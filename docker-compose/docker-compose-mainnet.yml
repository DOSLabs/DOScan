name: doscan-l1

# DOS Chain relaunched Avalanche L1 explorer on GCP.
# The archive AvalancheGo node runs separately on the same VM.

services:
  redis-db:
    image: redis@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    pull_policy: always
    restart: unless-stopped
    command: redis-server
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  db-init:
    image: postgres@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    pull_policy: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    entrypoint: ["sh", "-c", "chown -R 2000:2000 /var/lib/postgresql/data"]

  db:
    image: postgres@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    user: 2000:2000
    shm_size: 256m
    command: postgres -c 'max_connections=200' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/dos/doscan:11.2.3.commit.86fd0dd5@sha256:423bab078a679d3290cc6e276774a8ed201686636933e0d066ce9859270f700d
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ./envs/common-blockscout.env
      - ${DOSCAN_BLOCKSCOUT_SECRETS_ENV:-./envs/common-blockscout.env}
      - ./envs/common-blockscout-mainnet.env
    links:
      - db:database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v2/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: metados/blockscout-frontend:2.9.5@sha256:c36dcdc5cbab8ae9fa7556245c31b93f25fb093e4a5643f4e908347d2ee45d6a
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-/opt/doscan/envs}/common-frontend.env
      - ./envs/common-frontend-scan.env
    environment:
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  smart-contract-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier@sha256:57185ba6554577d7521c88d4b6c3ccc556bcd74c5459226b06328a1fdc8cb539
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-/opt/doscan/envs}/common-smart-contract-verifier.env

  visualizer:
    image: ghcr.io/blockscout/visualizer@sha256:ffce88a765b0466824175cc8fed6e6b31d682310a96933b98451aefdfffecdc7
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-/opt/doscan/envs}/common-visualizer.env

  sig-provider:
    image: ghcr.io/blockscout/sig-provider@sha256:450062a602257817bd38309ba4ad048039d244cdd0ce3e1e1d4103e069db66ab
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped

  user-ops-indexer:
    image: ghcr.io/blockscout/user-ops-indexer@sha256:d0ffe9c672d9c5cf1e035b2dd8e4baf9e9b28d3382822ea2d07e69a924562932
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      USER_OPS_INDEXER__INDEXER__RPC_URL: http://host.docker.internal:9650/ext/bc/2ewKoUrSjnviEgGmeTiELHBmNjxVTVczBPowST471rYUZvA9bk/rpc
      USER_OPS_INDEXER__INDEXER__CONCURRENCY: "5"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V06: "true"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V06_ENTRY_POINT: "0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V07: "true"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V07_ENTRY_POINT: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V08: "true"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V08_ENTRY_POINT: "0x4337084D9E255Ff0702461CF8895CE9E3b5Ff108"
      USER_OPS_INDEXER__INDEXER__REALTIME__ENABLED: "true"
      USER_OPS_INDEXER__INDEXER__PAST_RPC_LOGS_INDEXER__ENABLED: "true"
      USER_OPS_INDEXER__INDEXER__PAST_RPC_LOGS_INDEXER__BLOCK_RANGE: "1000"
      USER_OPS_INDEXER__INDEXER__PAST_DB_LOGS_INDEXER__ENABLED: "true"
      USER_OPS_INDEXER__INDEXER__PAST_DB_LOGS_INDEXER__START_BLOCK: "0"
      USER_OPS_INDEXER__INDEXER__PAST_DB_LOGS_INDEXER__END_BLOCK: "0"
      USER_OPS_INDEXER__INDEXER__TRACE_CLIENT: debug
      USER_OPS_INDEXER__DATABASE__CONNECT__URL: postgresql://postgres:@db:5432/blockscout
      USER_OPS_INDEXER__DATABASE__CREATE_DATABASE: "false"
      USER_OPS_INDEXER__DATABASE__RUN_MIGRATIONS: "true"
      USER_OPS_INDEXER__SERVER__HTTP__ADDR: "0.0.0.0:8050"

  interchain-indexer:
    image: ghcr.io/blockscout/interchain-indexer:v1.6.0@sha256:020e0753da3bb5340406feaabdae1950a0d651e5b175aee4565d6e3e7baed920
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      INTERCHAIN_INDEXER__DATABASE__CONNECT__URL: postgresql://postgres:@db:5432/interchain_indexer
      INTERCHAIN_INDEXER__DATABASE__CREATE_DATABASE: "true"
      INTERCHAIN_INDEXER__DATABASE__RUN_MIGRATIONS: "true"
      INTERCHAIN_INDEXER__CHAINS_CONFIG: /app/config/dos-chains.json
      INTERCHAIN_INDEXER__BRIDGES_CONFIG: /app/config/dos-bridges.json
      INTERCHAIN_INDEXER__API__USE_PAGINATION_TOKEN: "true"
      INTERCHAIN_INDEXER__TOKEN_INFO__BLOCKSCOUT_TOKEN_INFO__URL: https://contracts-info.services.blockscout.com
      INTERCHAIN_INDEXER__TOKEN_INFO__BLOCKSCOUT_TOKEN_INFO__IGNORE_CHAINS: "7979"
      INTERCHAIN_INDEXER__AVALANCHE_INDEXER__BATCH_SIZE: "2048"
      INTERCHAIN_INDEXER__AVALANCHE_INDEXER__PULL_INTERVAL_MS: "250"
      INTERCHAIN_INDEXER__METRICS__ENABLED: "true"
      INTERCHAIN_INDEXER__METRICS__ADDR: 0.0.0.0:6060
    volumes:
      - ./configs/interchain-indexer-chains.json:/app/config/dos-chains.json:ro
      - ./configs/interchain-indexer-bridges.json:/app/config/dos-bridges.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8050;
          printf "GET /api/v1/status/indexers HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          grep -Eq '"name":"avalanche"[^}]*"state":"running"' <&3'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  stats:
    image: ghcr.io/blockscout/stats@sha256:1091cacba9287b6930575fac2aa3512dec3a8e81de58316ca63a6c20e1ddc457
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STATS__DB_URL: postgresql://postgres:@db:5432/stats
      STATS__BLOCKSCOUT_DB_URL: postgresql://postgres:@db:5432/blockscout
      STATS__CREATE_DATABASE: "true"
      STATS__RUN_MIGRATIONS: "true"
      STATS__SERVER__HTTP__ADDR: 0.0.0.0:8050
      STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN: https://doscan.io
      STATS__IGNORE_BLOCKSCOUT_API_ABSENCE: "true"

  caddy:
    image: caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./Caddyfile-gcp-mainnet:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - 127.0.0.1:13080:80

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
