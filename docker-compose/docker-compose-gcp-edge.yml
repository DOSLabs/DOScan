services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - doscan_l1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  caddy_data:
  caddy_config:

networks:
  doscan_l1:
    external: true
    name: doscan-l1_default
