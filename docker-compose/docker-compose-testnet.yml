name: doscan-testnet

# DOS Chain Avalanche L1 testnet explorer on GCP.
# The archive AvalancheGo node runs separately on the same VM.

services:
  redis-db:
    image: redis:alpine
    pull_policy: always
    restart: unless-stopped
    command: redis-server
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  db-init:
    image: postgres:15
    pull_policy: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    entrypoint: ["sh", "-c", "chown -R 2000:2000 /var/lib/postgresql/data"]

  db:
    image: postgres:15
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    user: 2000:2000
    shm_size: 256m
    command: postgres -c 'max_connections=160' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/dos/doscan:11.2.3.commit.a1b48166@sha256:b604e1c0983c50f5b489b89f3d81ba257f86519007dc552920d6d278a57b0bd0
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    env_file:
      - ./envs/common-blockscout.env
      - ${DOSCAN_BLOCKSCOUT_SECRETS_ENV:-./envs/common-blockscout.env}
      - ./envs/common-blockscout-testnet.env
    links:
      - db:database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v2/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    image: metados/blockscout-frontend:2.9.5@sha256:c36dcdc5cbab8ae9fa7556245c31b93f25fb093e4a5643f4e908347d2ee45d6a
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-./envs}/common-frontend.env
      - ./envs/common-frontend-testnet.env
    environment:
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  smart-contract-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier@sha256:57185ba6554577d7521c88d4b6c3ccc556bcd74c5459226b06328a1fdc8cb539
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-./envs}/common-smart-contract-verifier.env

  visualizer:
    image: ghcr.io/blockscout/visualizer@sha256:ffce88a765b0466824175cc8fed6e6b31d682310a96933b98451aefdfffecdc7
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-./envs}/common-visualizer.env

  sig-provider:
    image: ghcr.io/blockscout/sig-provider@sha256:450062a602257817bd38309ba4ad048039d244cdd0ce3e1e1d4103e069db66ab
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped

  stats:
    image: ghcr.io/blockscout/stats@sha256:1091cacba9287b6930575fac2aa3512dec3a8e81de58316ca63a6c20e1ddc457
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STATS__DB_URL: postgresql://postgres:@db:5432/stats
      STATS__BLOCKSCOUT_DB_URL: postgresql://postgres:@db:5432/blockscout
      STATS__CREATE_DATABASE: "true"
      STATS__RUN_MIGRATIONS: "true"
      STATS__SERVER__HTTP__ADDR: 0.0.0.0:8050
      STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN: https://test.doscan.io
      STATS__IGNORE_BLOCKSCOUT_API_ABSENCE: "true"

  caddy:
    image: caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./Caddyfile-gcp-testnet:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - 127.0.0.1:13080:80
      - 127.0.0.1:8545:8545

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
