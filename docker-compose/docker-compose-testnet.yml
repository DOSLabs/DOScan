name: doscan-testnet

# DOS Chain Avalanche L1 testnet explorer on GCP.
# The archive AvalancheGo node runs separately on the same VM.

services:
  redis-db:
    image: redis:alpine
    pull_policy: always
    restart: unless-stopped
    command: redis-server
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  db-init:
    image: postgres:15
    pull_policy: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    entrypoint: ["sh", "-c", "chown -R 2000:2000 /var/lib/postgresql/data"]

  db:
    image: postgres:15
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    user: 2000:2000
    shm_size: 256m
    command: postgres -c 'max_connections=160' -c 'client_connection_check_interval=60000'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5

  bens-db:
    image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    pull_policy: always
    restart: unless-stopped
    command:
      - postgres
      - -cshared_preload_libraries=pg_stat_statements
      - -cmax_connections=100
    env_file:
      - ${DOSCAN_BENS_SECRETS_ENV:-/opt/doscan-testnet/envs/bens-secrets.env}
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: -E UTF8 --locale=C
    volumes:
      - bens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node -d graph-node"]
      interval: 15s
      timeout: 5s
      retries: 10

  bens-ipfs:
    image: ipfs/kubo:v0.43.0@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2
    pull_policy: always
    restart: unless-stopped
    volumes:
      - bens_ipfs_data:/data/ipfs

  bens-graph-node:
    image: graphprotocol/graph-node:v0.45.0@sha256:b0436347fb24f9ae45b6d3959cac97bf60b3238ad1633a875c118ff86a07a0d3
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      bens-db:
        condition: service_healthy
      bens-ipfs:
        condition: service_started
    env_file:
      - ${DOSCAN_BENS_SECRETS_ENV:-/opt/doscan-testnet/envs/bens-secrets.env}
    environment:
      postgres_host: bens-db
      postgres_user: graph-node
      postgres_db: graph-node
      ipfs: bens-ipfs:5001
      ethereum: dos-testnet:https://test.doschain.com/
      GRAPH_LOG: info

  bens:
    image: ghcr.io/blockscout/bens:v1.7.3@sha256:46c0708ad58a2533eadee4e40a3c88f45b48f5746031046d203cf9d7cfcb9851
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      bens-db:
        condition: service_healthy
      bens-graph-node:
        condition: service_started
    env_file:
      - ${DOSCAN_BENS_SECRETS_ENV:-/opt/doscan-testnet/envs/bens-secrets.env}
    environment:
      BENS__CONFIG: /app/config/dos-testnet.json
      BENS__DATABASE__CREATE_DATABASE: "false"
      BENS__DATABASE__RUN_MIGRATIONS: "true"
      BENS__SERVER__HTTP__ADDR: 0.0.0.0:8050
      BENS__SERVER__HTTP__ENABLED: "true"
      BENS__TRACING__ENABLED: "false"
      RUST_LOG: info
    volumes:
      - ./bens/config.json:/app/config/dos-testnet.json:ro

  bens-deployer:
    image: node:22.18.0-alpine3.22@sha256:1b2479dd35a99687d6638f5976fd235e26c5b37e8122f786fcd5fe231d63de5b
    profiles: ["bens-deploy"]
    environment:
      BENS_SUBGRAPH_VERSION: ${BENS_SUBGRAPH_VERSION:-testnet}
    depends_on:
      bens-graph-node:
        condition: service_started
      bens-ipfs:
        condition: service_started
    working_dir: /work
    volumes:
      - ./bens/subgraph:/source:ro
      - ./bens/deploy-subgraph.sh:/runtime/deploy-subgraph.sh:ro
    tmpfs:
      - /work
    command:
      - /bin/sh
      - -ec
      - exec /bin/sh /runtime/deploy-subgraph.sh

  backend:
    image: ghcr.io/dos/doscan:11.2.6.commit.99eb6e8a@sha256:60b6655e9c02028a8ce6a6eb5a7a1db6d4c23ab616e68a26319e00787089e084
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    env_file:
      - ./envs/common-blockscout.env
      - ${DOSCAN_BLOCKSCOUT_SECRETS_ENV:-./envs/common-blockscout.env}
      - ./envs/common-blockscout-testnet.env
    environment:
      MICROSERVICE_METADATA_ENABLED: "true"
    links:
      - db:database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v2/stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    image: metados/blockscout-frontend:2.10.0@sha256:4125d49b1658ba95b81075cabbc07120bebd90be95df49440aff5fa0e7e95eed
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-./envs}/common-frontend.env
      - ./envs/common-frontend-testnet.env
    environment:
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  smart-contract-verifier:
    image: ghcr.io/blockscout/smart-contract-verifier@sha256:57185ba6554577d7521c88d4b6c3ccc556bcd74c5459226b06328a1fdc8cb539
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-./envs}/common-smart-contract-verifier.env

  visualizer:
    image: ghcr.io/blockscout/visualizer@sha256:ffce88a765b0466824175cc8fed6e6b31d682310a96933b98451aefdfffecdc7
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ${DOSCAN_BASE_ENV_DIR:-./envs}/common-visualizer.env

  sig-provider:
    image: ghcr.io/blockscout/sig-provider@sha256:450062a602257817bd38309ba4ad048039d244cdd0ce3e1e1d4103e069db66ab
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped

  user-ops-indexer:
    image: ghcr.io/blockscout/user-ops-indexer@sha256:d0ffe9c672d9c5cf1e035b2dd8e4baf9e9b28d3382822ea2d07e69a924562932
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      USER_OPS_INDEXER__INDEXER__RPC_URL: http://10.148.0.7:9650/ext/bc/JASJZyVTWR7aviy4eY5yE8AVfdXtH33c1AinvzhLcVBARhcm9/rpc
      USER_OPS_INDEXER__INDEXER__CONCURRENCY: "5"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V06: "true"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V06_ENTRY_POINT: "0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V07: "true"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V07_ENTRY_POINT: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V08: "true"
      USER_OPS_INDEXER__INDEXER__ENTRYPOINTS__V08_ENTRY_POINT: "0x4337084D9E255Ff0702461CF8895CE9E3b5Ff108"
      USER_OPS_INDEXER__INDEXER__REALTIME__ENABLED: "true"
      USER_OPS_INDEXER__INDEXER__PAST_RPC_LOGS_INDEXER__ENABLED: "true"
      USER_OPS_INDEXER__INDEXER__PAST_RPC_LOGS_INDEXER__BLOCK_RANGE: "1000"
      USER_OPS_INDEXER__INDEXER__PAST_DB_LOGS_INDEXER__ENABLED: "true"
      USER_OPS_INDEXER__INDEXER__PAST_DB_LOGS_INDEXER__START_BLOCK: "0"
      USER_OPS_INDEXER__INDEXER__PAST_DB_LOGS_INDEXER__END_BLOCK: "0"
      USER_OPS_INDEXER__DATABASE__CONNECT__URL: postgresql://postgres:@db:5432/blockscout_jasj_20260809
      USER_OPS_INDEXER__DATABASE__CREATE_DATABASE: "false"
      USER_OPS_INDEXER__DATABASE__RUN_MIGRATIONS: "true"
      USER_OPS_INDEXER__SERVER__HTTP__ADDR: "0.0.0.0:8050"

  stats:
    image: ghcr.io/blockscout/stats@sha256:1091cacba9287b6930575fac2aa3512dec3a8e81de58316ca63a6c20e1ddc457
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STATS__DB_URL: postgresql://postgres:@db:5432/stats
      STATS__BLOCKSCOUT_DB_URL: postgresql://postgres:@db:5432/blockscout_jasj_20260809
      STATS__CREATE_DATABASE: "true"
      STATS__RUN_MIGRATIONS: "true"
      STATS__SERVER__HTTP__ADDR: 0.0.0.0:8050
      STATS__SERVER__HTTP__CORS__ALLOWED_ORIGIN: https://test.doscan.io
      STATS__IGNORE_BLOCKSCOUT_API_ABSENCE: "true"

  caddy:
    image: caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./Caddyfile-gcp-testnet:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - 127.0.0.1:13080:80
      - 127.0.0.1:8545:8545

volumes:
  postgres_data:
  redis_data:
  bens_postgres_data:
  bens_ipfs_data:
  caddy_data:
  caddy_config:
