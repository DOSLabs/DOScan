name: Deploy Config

on:
  push:
    branches: [main]
    paths:
      - "docker-compose/**"
      - ".github/workflows/deploy-config.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        required: true
        type: choice
        options:
          - mainnet
          - beta

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-config-${{ inputs.environment || 'mainnet' }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: dos--ai
  GCP_PROJECT_NUMBER: "535583621422"
  GCP_ZONE: asia-southeast1-b
  GCP_INSTANCE: doscan-mainnet
  GCP_SERVICE_ACCOUNT: doscan-deploy@dos--ai.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/535583621422/locations/global/workloadIdentityPools/github/providers/doscan-provider

jobs:
  deploy-mainnet:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'mainnet')
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - uses: actions/checkout@v4

      - name: Validate Mainnet and Testnet environment parity
        run: python scripts/validate-blockscout-env-parity.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Package deployment configuration
        run: |
          set -euo pipefail
          tar -czf /tmp/doscan-config.tgz \
            docker-compose/docker-compose-mainnet.yml \
            docker-compose/Caddyfile-gcp-mainnet \
            docker-compose/configs/mainnet-chain-config.json \
            docker-compose/envs/common-blockscout.env \
            docker-compose/envs/common-blockscout-mainnet.env \
            docker-compose/envs/common-frontend.env \
            docker-compose/envs/common-frontend-scan.env \
            docker-compose/envs/common-smart-contract-verifier.env \
            docker-compose/envs/common-visualizer.env

      - name: Upload configuration through IAP
        run: |
          set -euo pipefail
          gcloud compute scp \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            /tmp/doscan-config.tgz \
            "${GCP_INSTANCE}:/tmp/doscan-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"

      - name: Apply configuration and verify services
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_INSTANCE}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_ZONE}" \
            --tunnel-through-iap \
            --command='
              set -euo pipefail

              ARCHIVE="/tmp/doscan-config-${{ github.run_id }}-${{ github.run_attempt }}.tgz"
              SRC="$(mktemp -d /tmp/doscan-deploy.XXXXXX)"
              BACKUP="/opt/doscan-l1/backups/github-${{ github.run_id }}-${{ github.run_attempt }}"
              L1_PATH="/opt/doscan-l1"
              SHARED_ENV_PATH="/opt/doscan/envs"
              BLOCKSCOUT_SECRETS="${SHARED_ENV_PATH}/common-blockscout-secrets.env"
              CHAIN_CONFIG="/opt/avago/configs/chains/2ewKoUrSjnviEgGmeTiELHBmNjxVTVczBPowST471rYUZvA9bk/config.json"

              cleanup() {
                rm -rf "${SRC}" "${ARCHIVE}"
              }
              trap cleanup EXIT

              tar -xzf "${ARCHIVE}" -C "${SRC}"
              sudo mkdir -p "${BACKUP}" "${L1_PATH}/envs" "${SHARED_ENV_PATH}" "$(dirname "${CHAIN_CONFIG}")"

              sudo cp -a "${L1_PATH}/compose.yml" "${BACKUP}/compose.yml" 2>/dev/null || true
              sudo cp -a "${L1_PATH}/Caddyfile-gcp-mainnet" "${BACKUP}/Caddyfile-gcp-mainnet" 2>/dev/null || true
              sudo cp -a "${L1_PATH}/envs" "${BACKUP}/envs" 2>/dev/null || true
              sudo cp -a "${CHAIN_CONFIG}" "${BACKUP}/chain-config.json" 2>/dev/null || true

              if ! sudo test -s "${BLOCKSCOUT_SECRETS}"; then
                sudo awk -F= \
                  '"'"'$1 ~ /^(ACCOUNT_CLOAK_KEY|DATABASE_URL|RELEASE_COOKIE|SECRET_KEY_BASE)$/ {print}'"'"' \
                  "${SHARED_ENV_PATH}/common-blockscout.env" |
                  sudo tee "${BLOCKSCOUT_SECRETS}" >/dev/null
                sudo chmod 0600 "${BLOCKSCOUT_SECRETS}"
              fi

              CHAIN_CONFIG_CHANGED=0
              if ! sudo cmp -s "${SRC}/docker-compose/configs/mainnet-chain-config.json" "${CHAIN_CONFIG}"; then
                CHAIN_CONFIG_CHANGED=1
              fi

              sudo install -m 0644 "${SRC}/docker-compose/docker-compose-mainnet.yml" "${L1_PATH}/compose.yml"
              sudo install -m 0644 "${SRC}/docker-compose/Caddyfile-gcp-mainnet" "${L1_PATH}/Caddyfile-gcp-mainnet"
              sudo install -m 0644 "${SRC}/docker-compose/envs/common-blockscout.env" "${L1_PATH}/envs/common-blockscout.env"
              sudo install -m 0644 "${SRC}/docker-compose/envs/common-blockscout-mainnet.env" "${L1_PATH}/envs/common-blockscout-mainnet.env"
              sudo install -m 0644 "${SRC}/docker-compose/envs/common-frontend-scan.env" "${L1_PATH}/envs/common-frontend-scan.env"
              sudo install -m 0644 "${SRC}/docker-compose/envs/common-frontend.env" "${SHARED_ENV_PATH}/common-frontend.env"
              sudo install -m 0644 "${SRC}/docker-compose/envs/common-smart-contract-verifier.env" "${SHARED_ENV_PATH}/common-smart-contract-verifier.env"
              sudo install -m 0644 "${SRC}/docker-compose/envs/common-visualizer.env" "${SHARED_ENV_PATH}/common-visualizer.env"
              sudo install -m 0644 "${SRC}/docker-compose/configs/mainnet-chain-config.json" "${CHAIN_CONFIG}"

              if [ "${CHAIN_CONFIG_CHANGED}" -eq 1 ]; then
                cd /opt/avago/compose
                sudo docker compose restart avago
                for attempt in $(seq 1 24); do
                  if curl -fsS http://127.0.0.1:9650/ext/health >/dev/null; then
                    break
                  fi
                  if [ "${attempt}" -eq 24 ]; then
                    echo "AvalancheGo did not become healthy in time" >&2
                    exit 1
                  fi
                  sleep 5
                done
              fi

              cd "${L1_PATH}"
              sudo env DOSCAN_BLOCKSCOUT_SECRETS_ENV="${BLOCKSCOUT_SECRETS}" DOSCAN_BASE_ENV_DIR="${SHARED_ENV_PATH}" docker compose config -q
              sudo env DOSCAN_BLOCKSCOUT_SECRETS_ENV="${BLOCKSCOUT_SECRETS}" DOSCAN_BASE_ENV_DIR="${SHARED_ENV_PATH}" docker compose pull
              sudo env DOSCAN_BLOCKSCOUT_SECRETS_ENV="${BLOCKSCOUT_SECRETS}" DOSCAN_BASE_ENV_DIR="${SHARED_ENV_PATH}" docker compose up -d --remove-orphans

              for attempt in $(seq 1 24); do
                if curl -fsS http://127.0.0.1:13080/api/v2/stats >/dev/null &&
                   curl -fsS http://127.0.0.1:13080/api/v2/proxy/account-abstraction/status >/dev/null &&
                   curl -fsS http://127.0.0.1:13080/public-metrics >/dev/null; then
                  break
                fi
                if [ "${attempt}" -eq 24 ]; then
                  echo "DOScan did not become healthy in time" >&2
                  sudo docker compose ps
                  exit 1
                fi
                sleep 5
              done

              curl --fail --silent --show-error --retry 6 --retry-delay 5 https://doscan.io/api/v2/stats >/dev/null
              curl --fail --silent --show-error --retry 6 --retry-delay 5 https://doscan.io/api/v2/proxy/account-abstraction/status >/dev/null
              curl --fail --silent --show-error --retry 6 --retry-delay 5 https://doscan.io/public-metrics >/dev/null

              sudo docker compose ps
              echo "GCP mainnet deployment completed"
            '

  deploy-beta:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.environment == 'beta'
    runs-on: [self-hosted, beta]
    environment: beta
    permissions:
      contents: read
    steps:
      - name: Pull latest and restart services
        run: |
          set -euo pipefail
          REPO="$HOME/Projects/DOScan"
          DEPLOY="$REPO/docker-compose"

          cd "$REPO"
          git pull --ff-only origin main

          cd "$DEPLOY"
          docker compose -f docker-compose-beta.yml -p doscan pull
          docker compose -f docker-compose-beta.yml -p doscan up -d --remove-orphans

          echo "Beta deployment completed"
