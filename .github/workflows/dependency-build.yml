name: Dependency build

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/**/mix.exs"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "apps/**/yarn.lock"
      - "docker/Dockerfile"
      - "docker/oldUI.Dockerfile"
      - ".github/workflows/dependency-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "27.3.4.6"
  ELIXIR_VERSION: "1.19.4"
  MIX_ENV: prod

jobs:
  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect dependency and build changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files
          cat /tmp/changed-files

          if grep -Eq \
            '^(mix\.exs|mix\.lock|apps/.+/(mix\.exs|package\.json|package-lock\.json|yarn\.lock)|docker/(Dockerfile|oldUI\.Dockerfile)|\.github/workflows/dependency-build\.yml)$' \
            /tmp/changed-files; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  elixir-compile:
    name: Compile Elixir
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes automake autoconf build-essential file git libgmp-dev libtool make python3

      - name: Compile production application
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile --skip-umbrella-children
          mix compile

  production-docker:
    name: Build published production Docker image
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=dependency-build-production
          cache-to: type=gha,mode=max,scope=dependency-build-production

  old-ui-docker:
    name: Build old UI Docker image
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build old UI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/oldUI.Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=dependency-build-old-ui
          cache-to: type=gha,mode=max,scope=dependency-build-old-ui

  dependency-build-gate:
    name: Dependency build gate
    needs:
      - changes
      - elixir-compile
      - production-docker
      - old-ui-docker
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependency build results
        env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMPILE_RESULT: ${{ needs.elixir-compile.result }}
          PRODUCTION_RESULT: ${{ needs.production-docker.result }}
          OLD_UI_RESULT: ${{ needs.old-ui-docker.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Dependency change detection failed."
            exit 1
          fi

          if [ "$RELEVANT" != "true" ]; then
            echo "No dependency or build files changed."
            exit 0
          fi

          for result in "$COMPILE_RESULT" "$PRODUCTION_RESULT" "$OLD_UI_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required dependency build job did not succeed."
              exit 1
            fi
          done

          echo "All dependency build jobs succeeded."
