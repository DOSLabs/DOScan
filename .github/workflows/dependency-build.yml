name: Dependency build

on:
  pull_request:
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/**/mix.exs"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "apps/**/yarn.lock"
      - "docker/oldUI.Dockerfile"
      - ".github/workflows/dependency-build.yml"
  push:
    branches: [main]
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/**/mix.exs"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "apps/**/yarn.lock"
      - "docker/oldUI.Dockerfile"
      - ".github/workflows/dependency-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "27.3.4.6"
  ELIXIR_VERSION: "1.19.4"
  MIX_ENV: prod

jobs:
  elixir-compile:
    name: Compile Elixir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes automake autoconf build-essential file git libgmp-dev libtool make python3

      - name: Compile production application
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile --skip-umbrella-children
          mix compile

  production-docker:
    name: Build production Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docker/oldUI.Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=dependency-build
          cache-to: type=gha,mode=max,scope=dependency-build
