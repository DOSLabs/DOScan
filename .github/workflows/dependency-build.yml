name: Dependency build

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "mix.exs"
      - "mix.lock"
      - "apps/**/mix.exs"
      - "apps/**/package.json"
      - "apps/**/package-lock.json"
      - "apps/**/yarn.lock"
      - "docker/Dockerfile"
      - "docker/oldUI.Dockerfile"
      - "docker-compose/envs/common-blockscout-mainnet.env"
      - "docker-compose/envs/common-blockscout-testnet.env"
      - "docker-compose/token-lists/**"
      - ".github/workflows/dependency-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "27.3.4.6"
  ELIXIR_VERSION: "1.19.4"
  MIX_ENV: prod

jobs:
  token-lists:
    name: Validate DOS Chain token lists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate schema, networks, assets, and environment URLs
        run: |
          set -euo pipefail

          schema_url="https://raw.githubusercontent.com/Uniswap/token-lists/01705f94a307270b6c0fe5f55c7e66f7b92373cc/src/tokenlist.schema.json"
          curl --fail --silent --show-error "${schema_url}" > "$RUNNER_TEMP/tokenlist.schema.json"
          npx --yes ajv-cli@5.0.0 validate \
            --spec=draft7 \
            --strict=false \
            -s "$RUNNER_TEMP/tokenlist.schema.json" \
            -d docker-compose/token-lists/mainnet.json

          jq --exit-status \
            '
              (.timestamp | fromdateiso8601 > 0) and
              (.tokens | length > 0) and
              (.tokens | all(
                (.chainId == 7979) and
                (.logoURI | test("^https://raw\\.githubusercontent\\.com/DOS/DOScan/main/docker-compose/token-lists/assets/[a-z0-9._-]+\\.(svg|png)$"))
              )) and
              (([.tokens[].address | ascii_downcase] | unique | length) == (.tokens | length))
            ' \
            docker-compose/token-lists/mainnet.json >/dev/null

          while IFS= read -r logo_url; do
            asset_path="${logo_url#https://raw.githubusercontent.com/DOS/DOScan/main/}"
            test -s "${asset_path}"
            if grep -Eqi '<script|onload=|href=' "${asset_path}"; then
              echo "::error::Token logo contains executable or external content: ${asset_path}"
              exit 1
            fi
          done < <(jq --raw-output '.tokens[].logoURI' docker-compose/token-lists/mainnet.json)

          grep -Fxq \
            'TOKEN_LIST_URL=https://raw.githubusercontent.com/DOS/DOScan/main/docker-compose/token-lists/mainnet.json' \
            docker-compose/envs/common-blockscout-mainnet.env

      - name: Validate Mainnet and Testnet environment parity
        run: python scripts/validate-blockscout-env-parity.py

  changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect dependency and build changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files
          cat /tmp/changed-files

          if grep -Eq \
            '^(mix\.exs|mix\.lock|apps/.+/(mix\.exs|package\.json|package-lock\.json|yarn\.lock)|docker/(Dockerfile|oldUI\.Dockerfile)|\.github/workflows/dependency-build\.yml)$' \
            /tmp/changed-files; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  elixir-compile:
    name: Compile Elixir
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            automake \
            autoconf \
            build-essential \
            ffmpeg \
            file \
            git \
            libavcodec-dev \
            libavdevice-dev \
            libavformat-dev \
            libavutil-dev \
            libgmp-dev \
            libswscale-dev \
            libtool \
            make \
            python3

      - name: Compile production application
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix deps.compile --skip-umbrella-children
          mix compile

      - name: Smoke test NFT image processing
        run: |
          mix run --no-start -e '
            source = """
            <svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
              <rect width="600" height="600" fill="#ff2e29"/>
            </svg>
            """

            {:ok, image} = Image.from_binary(source, pages: -1)
            600 = Image.width(image)
            600 = Image.height(image)
            1 = Image.pages(image)

            thumbnails =
              NFTMediaHandler.Image.Resizer.resize(
                image,
                "https://example.com/nft/smoke.png",
                ".png"
              )

            [60, 250, 500] = Enum.map(thumbnails, &elem(&1, 0))

            Enum.each(thumbnails, fn {size, encoded, file_name} ->
              true = String.ends_with?(file_name, "_#{size}x#{size}.png")
              {:ok, reloaded} = Image.from_binary(encoded, pages: -1)
              ^size = Image.width(reloaded)
              ^size = Image.height(reloaded)
            end)
          '

      - name: Smoke test NFT video processing
        run: |
          video_dir="$(mktemp --directory)"
          video_path="$video_dir/smoke.mp4"
          trap 'rm -rf "$video_dir"' EXIT

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i color=c=red:s=600x600:d=1 \
            -c:v mpeg4 \
            -pix_fmt yuv420p \
            "$video_path"

          VIDEO_PATH="$video_path" mix run --no-start -e '
            video_path = System.fetch_env!("VIDEO_PATH")

            {:ok, image} =
              Image.Video.with_video(video_path, fn video ->
                Image.Video.image_from_video(video, frame: 0)
              end)

            600 = Image.width(image)
            600 = Image.height(image)

            thumbnails =
              NFTMediaHandler.Image.Resizer.resize(
                image,
                "https://example.com/nft/smoke.mp4",
                ".jpg"
              )

            [60, 250, 500] = Enum.map(thumbnails, &elem(&1, 0))
          '

  production-docker:
    name: Build published production Docker image
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate NFT video fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          mkdir -p "$RUNNER_TEMP/nft-video-smoke"
          ffmpeg \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i color=c=red:s=600x600:d=1 \
            -c:v mpeg4 \
            -pix_fmt yuv420p \
            "$RUNNER_TEMP/nft-video-smoke/smoke.mp4"

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: doscan-dependency-build:local
          cache-from: type=gha,scope=dependency-build-production
          cache-to: type=gha,mode=max,scope=dependency-build-production

      - name: Smoke test production image NFT video processing
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/nft-video-smoke:/tmp/smoke:ro" \
            doscan-dependency-build:local \
            elixir -pa '/app/lib/*/ebin' -e '
              video_path = "/tmp/smoke/smoke.mp4"

              {:ok, image} =
                Image.Video.with_video(video_path, fn video ->
                  Image.Video.image_from_video(video, frame: 0)
                end)

              600 = Image.width(image)
              600 = Image.height(image)

              [60, 250, 500] =
                image
                |> NFTMediaHandler.Image.Resizer.resize(
                  "https://example.com/nft/smoke.mp4",
                  ".jpg"
                )
                |> Enum.map(&elem(&1, 0))

              IO.puts("NFT_VIDEO_SMOKE_OK")
            '

  old-ui-docker:
    name: Build old UI Docker image
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build old UI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/oldUI.Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=dependency-build-old-ui
          cache-to: type=gha,mode=max,scope=dependency-build-old-ui

  dependency-build-gate:
    name: Dependency build gate
    needs:
      - token-lists
      - changes
      - elixir-compile
      - production-docker
      - old-ui-docker
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependency build results
        env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TOKEN_LISTS_RESULT: ${{ needs.token-lists.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMPILE_RESULT: ${{ needs.elixir-compile.result }}
          PRODUCTION_RESULT: ${{ needs.production-docker.result }}
          OLD_UI_RESULT: ${{ needs.old-ui-docker.result }}
        run: |
          set -euo pipefail

          if [ "$TOKEN_LISTS_RESULT" != "success" ]; then
            echo "::error::DOS Chain token list validation failed."
            exit 1
          fi

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Dependency change detection failed."
            exit 1
          fi

          if [ "$RELEVANT" != "true" ]; then
            echo "No dependency or build files changed."
            exit 0
          fi

          for result in "$COMPILE_RESULT" "$PRODUCTION_RESULT" "$OLD_UI_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required dependency build job did not succeed."
              exit 1
            fi
          done

          echo "All dependency build jobs succeeded."
