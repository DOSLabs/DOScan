name: NFT media tests

on:
  pull_request:
    paths:
      - "apps/nft_media_handler/**"
      - "apps/explorer/lib/explorer/chain/token/instance/media_urls.ex"
      - "docker/Dockerfile"
      - ".github/workflows/nft-media-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/nft_media_handler/**"
      - "apps/explorer/lib/explorer/chain/token/instance/media_urls.ex"
      - "docker/Dockerfile"
      - ".github/workflows/nft-media-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nft-media-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: NFT media handler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          target: builder
          load: true
          tags: doscan:nft-media-tests
          cache-from: type=gha,scope=nft-media-tests
          cache-to: type=gha,mode=max,scope=nft-media-tests

      - name: Run NFT media regression tests
        run: |
          docker run --rm \
            -v "${PWD}/apps/nft_media_handler/test:/work/test:ro" \
            doscan:nft-media-tests \
            sh -lc 'ERL_LIBS=/app/_build/prod/lib elixir \
              -r /work/test/test_helper.exs \
              /work/test/nft_media_handler_test.exs'
