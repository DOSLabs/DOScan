name: Publish regular Docker image on demand

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 10.2.1). If empty and triggered by tag, derived from tag name.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

env:
  OTP_VERSION: '27.3.4.6'
  ELIXIR_VERSION: '1.19.4'

concurrency:
  group: publish-regular-docker-image
  cancel-in-progress: false

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend_image.outputs.digest }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            echo "::error::No release_version input and not running on a tag"
            exit 1
          fi
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building RELEASE_VERSION=$VERSION"

      - name: Setup repo
        uses: ./.github/actions/setup-repo
        id: setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          docker-remote-multi-platform: false

      - name: Build and push Docker image (indexer + API)
        id: backend_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/dos/doscan:buildcache
          cache-to: type=registry,ref=ghcr.io/dos/doscan:buildcache,mode=max
          tags: ghcr.io/dos/doscan:${{ steps.version.outputs.release_version }}.commit.${{ env.SHORT_SHA }}
          labels: ${{ steps.setup.outputs.docker-labels }}
          platforms: linux/amd64
          build-args: |
            DECODE_NOT_A_CONTRACT_CALLS=false
            MIXPANEL_URL=
            MIXPANEL_TOKEN=
            AMPLITUDE_URL=
            AMPLITUDE_API_KEY=
            BLOCKSCOUT_VERSION=v${{ steps.version.outputs.release_version }}.+commit.${{ env.SHORT_SHA }}
            RELEASE_VERSION=${{ steps.version.outputs.release_version }}

      - name: Build and push Docker image (indexer)
        id: indexer_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/dos/doscan:${{ steps.version.outputs.release_version }}.commit.${{ env.SHORT_SHA }}-indexer
          labels: ${{ steps.setup.outputs.docker-labels }}
          platforms: linux/amd64
          build-args: |
            DISABLE_API=true
            DECODE_NOT_A_CONTRACT_CALLS=false
            MIXPANEL_URL=
            MIXPANEL_TOKEN=
            AMPLITUDE_URL=
            AMPLITUDE_API_KEY=
            BLOCKSCOUT_VERSION=v${{ steps.version.outputs.release_version }}.+commit.${{ env.SHORT_SHA }}
            RELEASE_VERSION=${{ steps.version.outputs.release_version }}

  update_deployment_pins:
    name: Update deployment image pins
    needs: push_to_registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Commit deployment image pins
        env:
          BACKEND_DIGEST: ${{ needs.push_to_registry.outputs.backend_digest }}
          RELEASE_VERSION: ${{ needs.push_to_registry.outputs.release_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="ghcr.io/dos/doscan:${RELEASE_VERSION}.commit.${SHORT_SHA}@${BACKEND_DIGEST}"
          sed -i -E \
            "s#ghcr.io/dos/doscan:[^[:space:]]+#${IMAGE}#" \
            docker-compose/docker-compose-mainnet.yml \
            docker-compose/docker-compose-testnet.yml \
            docker-compose/docker-compose-beta.yml

          if git diff --quiet -- docker-compose/; then
            echo "Deployment image pins are already current"
          else
            git add \
              docker-compose/docker-compose-mainnet.yml \
              docker-compose/docker-compose-testnet.yml \
              docker-compose/docker-compose-beta.yml
            git commit -m "chore: deploy DOScan ${RELEASE_VERSION}"
            git push origin main
          fi
